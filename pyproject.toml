[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ballvision-model"
version = "0.1.0"
description = "Basketball video analysis baseline with identity-free track association"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.0",
  "uvicorn[standard]>=0.29",
  "ultralytics>=8.4",
  "opencv-python>=5.0",
  "rfdetr>=1.12",
  "transformers>=5.22",
  "rapidocr_onnxruntime>=1.4"
]

[tool.setuptools.packages.find]
where = ["src"]
